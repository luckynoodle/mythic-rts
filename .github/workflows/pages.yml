name: Web build (GitHub Pages)

# Builds the game for the browser and publishes it to GitHub Pages on every
# push to main. The web build uses Godot's Compatibility renderer (WebGL 2);
# the iOS build keeps the Mobile renderer. Same project, same code.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# (GitHub Pages needs a public repo on the Free plan, or GitHub Pro for private.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3-stable
  GODOT_TEMPLATES: 4.3.stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-web-${{ env.GODOT_VERSION }}

      - name: Download Godot and web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_TEMPLATES}
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          # Only the web templates are needed (the full archive is ~1 GB).
          unzip -q -j /tmp/templates.tpz "templates/web_*" "templates/version.txt" \
            -d ~/.local/share/godot/export_templates/${GODOT_TEMPLATES}
          rm /tmp/templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --import || true

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --export-release "Web" build/web/index.html 2>&1 | grep -v "savepack: step" || true
          test -f build/web/index.wasm && test -f build/web/index.pck
          touch build/web/.nojekyll
          ls -la build/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
